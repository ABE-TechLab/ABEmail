name: Application CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check email design renderer
        run: npm run test:email-design

      - name: Test webhook retry state handling
        run: npm run test:email-webhooks

      - name: Verify workspace navigation contract
        run: npm run check:navigation

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start isolated local database
        run: supabase db start

      - name: Run tenant isolation and authorization tests
        run: supabase test db
